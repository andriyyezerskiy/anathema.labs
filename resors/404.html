<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Resors</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/anathema.labs/resors/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/anathema.labs/resors/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#f6f4f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#100a16" media="(prefers-color-scheme: dark)" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4f8;
      --text: #1c1c1e;
      --muted: rgba(28,28,30,0.62);
      --accent: #007aff;
      --accent-grad: #46b1ff;
      --card-bg: rgba(255,255,255,0.65);
      --border: rgba(0,0,0,0.08);
      --shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #100a16;
        --text: #f5f5f7;
        --muted: rgba(245,245,247,0.62);
        --accent: #0a84ff;
        --accent-grad: #64d2ff;
        --card-bg: rgba(34,28,42,0.55);
        --border: rgba(255,255,255,0.1);
        --shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    .ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: drift 22s ease-in-out infinite alternate; }
    .blob.b1 { width: 46vw; height: 46vw; top: -14vw; left: -10vw; background: #7c3aed; }
    .blob.b2 { width: 40vw; height: 40vw; top: 40vh; right: -14vw; background: #e11d48; animation-delay: -8s; }
    @media (prefers-color-scheme: dark) { .blob { opacity: 0.35; } }
    @keyframes drift {
      0% { transform: translate(0,0) scale(1); }
      50% { transform: translate(4vw,3vh) scale(1.1); }
      100% { transform: translate(-3vw,-2vh) scale(0.95); }
    }
    @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
    .code {
      font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; letter-spacing: -0.04em; margin: 0;
      background: linear-gradient(110deg, var(--accent), var(--accent-grad));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 800; letter-spacing: -0.02em; margin: 0.2rem 0 0.6rem; }
    p { color: var(--muted); max-width: 420px; margin: 0 auto 2rem; line-height: 1.55; }
    a.button {
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #fff;
      background: var(--accent); font-weight: 600; padding: 0.85rem 1.6rem; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,122,255,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    a.button:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 16px 40px rgba(0,122,255,0.45); }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
  <a class="button" href="/anathema.labs/resors/">Back to Resors</a>
</body>
</html>
