<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfbfd;
      --bg-alt: #f5f5f7;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --accent-2: #0071e3;
      --card-bg: #ffffff;
      --card-strong: #ffffff;
      --border: rgba(0,0,0,0.10);
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-alt: #0d0d0f;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #2997ff;
        --accent-2: #2997ff;
        --card-bg: #1c1c1e;
        --card-strong: #232325;
        --border: rgba(255,255,255,0.12);
        --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 12px 32px rgba(0,0,0,0.55);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    .code {
      font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; letter-spacing: -0.04em; margin: 0;
      background: linear-gradient(110deg, var(--accent), var(--accent-grad));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 800; letter-spacing: -0.02em; margin: 0.2rem 0 0.6rem; }
    p { color: var(--muted); max-width: 420px; margin: 0 auto 2rem; line-height: 1.55; }
    a.button {
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #fff;
      background: var(--accent); font-weight: 600; padding: 0.85rem 1.6rem; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,122,255,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    a.button:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 16px 40px rgba(0,122,255,0.45); }
  </style>
</head>

  <p class="code">404</p>
